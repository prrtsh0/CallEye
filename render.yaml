# Render Blueprint — one-click deploy for CallEye.
# Uses the Dockerfile at the repo root. The image trains the ML classifier at
# build time, so the deployed service always ships a working model.
services:
  - type: web
    name: calleye
    runtime: docker
    repo: https://github.com/prrtsh0/CallEye.git
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Mock mode = zero STT credits. Flip to "live" when you have real Gnani
      # credentials (set via the secret env vars below, never in chat).
      - key: GNANI_MODE
        value: live
      # Invite codes for live mode (comma-separated). Leave empty for open.
      - key: INVITE_CODES
        value: DEMO123
      # --- Gnani Prisma live STT ---
      # Paste the real SECRETS (API key) in the Render dashboard (Service >
      # Environment) — never in this file and never in chat. The non-secret
      # STT endpoint has a documented default below.
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_STT_WS_URL
        value: wss://api.vachana.ai/stt/v3
      - key: GNANI_TTS_URL
        sync: false
      # --- Gnani Evon reasoning (explanations) ---
      - key: GNANI_EVON_URL
        sync: false
      - key: GNANI_EVON_API_KEY
        sync: false
      - key: GNANI_EVON_MODEL
        sync: false
      # --- Neon Postgres ---
      # Set to your Neon DSN (postgres://…) in the Render dashboard to store
      # users in a managed, persistent database instead of local SQLite.
      - key: DATABASE_URL
        sync: false
      # --- Admin ---
      # Protect /admin/monitor and /admin/usage. Paste an invented strong random
      # string in the Render dashboard; send it as the "x-admin-token" header.
      - key: ADMIN_TOKEN
        sync: false
