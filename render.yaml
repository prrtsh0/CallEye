# Render Blueprint — one-click deploy for CallEye.
# Uses the Dockerfile at the repo root. The image trains the ML classifier at
# build time, so the deployed service always ships a working model.
services:
  - type: web
    name: calleye
    runtime: docker
    repo: https://github.com/prrtsh0/CallEye.git
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Mock mode = zero STT credits. Flip to "live" when you have real Gnani
      # credentials (set via the secret env vars below, never in chat).
      - key: GNANI_MODE
        value: mock
      # Invite codes for live mode (comma-separated). Leave empty for open.
      - key: INVITE_CODES
        value: ""
      # --- Gnani Prisma live STT ---
      # Paste the real values in the Render dashboard (Service > Environment),
      # NOT in this file and NOT in chat.
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_STT_WS_URL
        sync: false
      - key: GNANI_TTS_URL
        sync: false
      # --- Neon Postgres ---
      # Set to your Neon DSN (postgres://…) in the Render dashboard to store
      # users in a managed, persistent database instead of local SQLite.
      - key: DATABASE_URL
        sync: false
